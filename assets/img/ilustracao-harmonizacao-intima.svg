<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="600" height="750">
  <!-- Ilustracao da harmonizacao intima (19/10/2026): silhueta da cintura as coxas, de calcinha,
       no traco do monograma, com os pontos de aplicacao e os arcos da placa. Sem nudez.
       Refeita em 20/10/2026 com proporcao de corpo de mulher (pedido dele: cintura alta demais e
       parte intima baixa demais). Medida em "cabeca" = 240px: cintura y125, umbigo y167, quadril
       mais largo y350, virilha y432 (1,25 cabeca abaixo da cintura); cintura/quadril ~0,68. -->
  <title>Ilustração da harmonização íntima</title>
  <rect width="600" height="750" fill="#F3EFE8"/>
  <g fill="none" stroke="#E2D8C8" stroke-width="14">
    <path d="M330 0A270 270 0 0 0 600 270"/>
    <path d="M372 0A228 228 0 0 0 600 228"/>
    <path d="M414 0A186 186 0 0 0 600 186"/>
  </g>
  <g fill="none" stroke="#E8DCCB" stroke-width="12">
    <path d="M0 520A230 230 0 0 1 230 750"/>
    <path d="M0 566A184 184 0 0 1 184 750"/>
  </g>
  <!-- corpo: fundo opaco pra os arcos passarem por tras -->
  <path d="M150 0C160 45 168 95 166 125C163 190 106 262 102 350C98 440 122 600 146 750H454C478 600 502 440 498 350C494 262 437 190 434 125C432 95 440 45 450 0Z" fill="#F3EFE8"/>
  <!-- calcinha -->
  <path d="M121 263C200 285 400 285 479 263C432 322 354 396 318 428C308 436 292 436 282 428C246 396 168 322 121 263Z" fill="#E8DCCB"/>
  <!-- area dos pontos -->
  <circle cx="300" cy="382" r="50" fill="none" stroke="#BBA585" stroke-width="1.6" stroke-dasharray="3 7" stroke-linecap="round"/>
  <g fill="#806A4B">
    <circle cx="281" cy="362" r="3.6"/><circle cx="319" cy="362" r="3.6"/>
    <circle cx="276" cy="386" r="3.6"/><circle cx="324" cy="386" r="3.6"/>
    <circle cx="285" cy="409" r="3.6"/><circle cx="315" cy="409" r="3.6"/>
  </g>
  <g fill="none" stroke="#464A47" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <!-- contorno do corpo -->
    <path d="M150 0C160 45 168 95 166 125C163 190 106 262 102 350C98 440 122 600 146 750"/>
    <path d="M450 0C440 45 432 95 434 125C437 190 494 262 498 350C502 440 478 600 454 750"/>
    <!-- coxas por dentro -->
    <path d="M282 428C280 520 272 640 266 750"/>
    <path d="M318 428C320 520 328 640 334 750"/>
    <!-- calcinha: cos e cavas -->
    <path d="M121 263C200 285 400 285 479 263"/>
    <path d="M121 263C168 322 246 396 282 428C292 436 308 436 318 428C354 396 432 322 479 263"/>
    <!-- umbigo -->
    <path d="M295 162C297 173 303 173 305 162"/>
  </g>
</svg>
